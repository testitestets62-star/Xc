name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build GitHub Browser APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check project structure
        run: |
          echo "=== Project ==="
          pwd
          echo ""
          echo "=== Files ==="
          find . -maxdepth 3 -type f | sort
          echo ""
          echo "=== Gradle files ==="
          find . -maxdepth 3 \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" \) -print

      - name: Make Gradle wrapper executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew was not found!"
            exit 1
          fi

      - name: Check Gradle
        run: |
          ./gradlew --version

      - name: Clean project
        run: |
          ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Find APK
        if: always()
        run: |
          echo "=== APK files ==="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GitHubBrowser-debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
